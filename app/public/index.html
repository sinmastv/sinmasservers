<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Icecast AutoDJ</title><style>
:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#eef2f6}header{padding:18px 26px;border-bottom:1px solid #242a31;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1280px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}.card{background:#12161b;border:1px solid #252c34;border-radius:16px;padding:18px}.wide{grid-column:1/-1}h1,h2{margin:0 0 14px}label{display:block;margin:10px 0 4px;color:#aab4c0}input,select,button{width:100%;padding:10px 12px;border-radius:9px;border:1px solid #303946;background:#0d1116;color:#fff}button{cursor:pointer;background:#202833;font-weight:700}.primary{background:#fff;color:#000}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none}.status{display:flex;gap:12px;flex-wrap:wrap}.pill{padding:7px 10px;border-radius:99px;background:#1b222b}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button{width:auto}.track{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #242a31}.danger{background:#38171a}small{color:#8994a3}.hero{font-size:28px;font-weight:800}.muted{color:#93a0ae}</style></head><body>
<header><div><b>ICECAST AUTODJ</b> <span class="muted">v2</span></div><button id="logout" style="width:auto" class="hidden">Salir</button></header>
<div class="wrap"><div id="auth"></div><main id="panel" class="hidden"><div class="tabs"><button onclick="show('dashboard')">Dashboard</button><button onclick="show('station')">Emisora</button><button onclick="show('autodj')">AutoDJ</button><button onclick="show('live')">Live DJ</button><button onclick="show('icecast')">Icecast</button><button onclick="show('library')">Biblioteca</button><button onclick="show('security')">Seguridad</button></div><div id="content"></div></main></div>
<script>
let cfg=null,current='dashboard'; const $=s=>document.querySelector(s);async function api(u,o={}){o.headers={'Content-Type':'application/json',...(o.headers||{})};let r=await fetch(u,o);if(r.status===401){login();throw 0}let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Error');return j}
async function boot(){let s=await api('/api/setup');s.needsSetup?setup():login(true)}
function setup(){auth.innerHTML=`<div class="card" style="max-width:480px;margin:60px auto"><h1>Crear propietario</h1><p class="muted">Primer acceso. Esta cuenta tendrá control total de la radio.</p><label>Usuario</label><input id="u"><label>Contraseña (mínimo 10)</label><input id="p" type="password"><br><br><button class="primary" onclick="doSetup()">Crear propietario</button></div>`}
async function doSetup(){await api('/api/setup',{method:'POST',body:JSON.stringify({username:u.value,password:p.value})});openPanel()}
function login(silent=false){panel.classList.add('hidden');logout.classList.add('hidden');auth.innerHTML=`<div class="card" style="max-width:480px;margin:60px auto"><h1>Acceso propietario</h1><label>Usuario</label><input id="u"><label>Contraseña</label><input id="p" type="password"><br><br><button class="primary" onclick="doLogin()">Entrar</button></div>`}
async function doLogin(){await api('/api/login',{method:'POST',body:JSON.stringify({username:u.value,password:p.value})});openPanel()}
async function openPanel(){auth.innerHTML='';panel.classList.remove('hidden');logout.classList.remove('hidden');cfg=await api('/api/config');render()}
logout.onclick=async()=>{await api('/api/logout',{method:'POST'});login()}; function show(x){current=x;render()}
function field(label,path,type='text'){let v=path.split('.').reduce((o,k)=>o[k],cfg);if(type==='checkbox')return `<label><input data-p="${path}" type="checkbox" ${v?'checked':''} style="width:auto"> ${label}</label>`;return `<label>${label}</label><input data-p="${path}" type="${type}" value="${String(v??'').replace(/"/g,'&quot;')}">`}
function sel(label,path,opts){let v=path.split('.').reduce((o,k)=>o[k],cfg);return `<label>${label}</label><select data-p="${path}">${opts.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`}
async function save(){document.querySelectorAll('[data-p]').forEach(e=>{let a=e.dataset.p.split('.'),o=cfg;while(a.length>1)o=o[a.shift()];let v=e.type==='checkbox'?e.checked:(e.type==='number'?Number(e.value):e.value);o[a[0]]=v});await api('/api/config',{method:'PUT',body:JSON.stringify(cfg)});await api('/api/restart',{method:'POST'});alert('Guardado y servicios reiniciados')}
function saveBtn(){return `<br><button class="primary" onclick="save()">Guardar y aplicar</button>`}
async function render(){let c=content;if(current==='dashboard'){let st=await api('/api/status').catch(()=>({}));let src=st.status?.icestats?.source; if(Array.isArray(src))src=src[0];c.innerHTML=`<div class="grid"><div class="card"><div class="hero">${cfg.station.name}</div><div class="status"><span class="pill">Icecast ${st.icecast?'🟢':'🔴'}</span><span class="pill">AutoDJ ${st.liquidsoap?'🟢':'🔴'}</span></div><p class="muted">${src?.title||'Sin metadata actual'}</p><b>${src?.listeners||0} oyentes</b></div><div class="card"><h2>Acciones</h2><button onclick="api('/api/restart',{method:'POST'}).then(()=>render())">Reiniciar radio</button><br><br><button onclick="api('/api/restart-autodj',{method:'POST'}).then(()=>render())">Reiniciar AutoDJ</button><br><br><button onclick="api('/api/playlist/rebuild',{method:'POST'}).then(x=>alert(x.count+' pistas'))">Reconstruir playlist</button></div></div>`}
else if(current==='station')c.innerHTML=`<div class="card"><h2>Emisora</h2>${field('Nombre','station.name')}${field('Descripción','station.description')}${field('Género','station.genre')}${field('URL pública','station.url')}${field('Ubicación','station.location')}${field('Email administrador','station.adminEmail','email')}${field('Publicar en directorio','station.public','checkbox')}<h2>Stream</h2>${field('Mount','stream.mount')}${field('Nombre stream','stream.name')}${field('Descripción stream','stream.description')}${field('Género stream','stream.genre')}${field('Bitrate kbps','stream.bitrate','number')}${sel('Formato','stream.format',['mp3','ogg','opus'])}${field('Sample rate','stream.samplerate','number')}${field('Canales','stream.channels','number')}${saveBtn()}</div>`
else if(current==='autodj')c.innerHTML=`<div class="card"><h2>AutoDJ</h2>${field('Activado','autodj.enabled','checkbox')}${field('Playlist','autodj.playlist')}${sel('Orden','autodj.mode',['random','sequential'])}${field('Crossfade','autodj.crossfade','checkbox')}${field('Segundos crossfade','autodj.crossfadeSeconds','number')}${field('ReplayGain','autodj.replayGain','checkbox')}${field('Normalización','autodj.normalize','checkbox')}${saveBtn()}</div>`
else if(current==='live')c.innerHTML=`<div class="card"><h2>Live DJ</h2>${field('Activado','live.enabled','checkbox')}<label>Puerto</label><input disabled value="${cfg.live.port}">${field('Mount de entrada','live.mount')}${field('Usuario DJ','live.user')}${field('Contraseña DJ','live.password')}${field('Fade in','live.fadeIn','number')}${field('Fade out','live.fadeOut','number')}${saveBtn()}</div>`
else if(current==='icecast')c.innerHTML=`<div class="card"><h2>Icecast</h2>${field('Hostname','icecast.hostname')}<label>Puerto Icecast</label><input disabled value="${cfg.icecast.port}">${field('Máximo clientes','icecast.maxClients','number')}${field('Máximo sources','icecast.maxSources','number')}${field('Source password','icecast.sourcePassword')}${field('Relay password','icecast.relayPassword')}${field('Admin user','icecast.adminUser')}${field('Admin password','icecast.adminPassword')}${field('Burst size','icecast.burstSize','number')}${field('Queue size','icecast.queueSize','number')}${saveBtn()}</div>`
else if(current==='library'){let a=await api('/api/library');c.innerHTML=`<div class="card"><h2>Biblioteca</h2><input id="files" type="file" multiple accept="audio/*"><br><br><button class="primary" onclick="upload()">Subir música</button><p>${a.length} archivos</p>${a.map(x=>`<div class="track"><span>${x.name}<br><small>${(x.size/1048576).toFixed(1)} MB</small></span><button class="danger" style="width:auto" onclick="del('${encodeURIComponent(x.name)}')">Borrar</button></div>`).join('')}</div>`}
else c.innerHTML=`<div class="card"><h2>Seguridad</h2><label>Contraseña actual</label><input id="cur" type="password"><label>Nueva contraseña</label><input id="np" type="password"><br><br><button class="primary" onclick="changePass()">Cambiar contraseña</button></div>`}
async function upload(){let fd=new FormData();for(let f of files.files)fd.append('files',f);let r=await fetch('/api/library/upload',{method:'POST',body:fd});if(!r.ok)alert('Error');else render()}
async function del(n){if(confirm('¿Borrar archivo?')){await api('/api/library/'+n,{method:'DELETE'});render()}}
async function changePass(){await api('/api/password',{method:'POST',body:JSON.stringify({current:cur.value,password:np.value})});alert('Contraseña cambiada')}
boot().catch(console.error)
</script></body></html>
